name: WhiteBoxCartoonization
options:
  bundleIdPrefix: com.ldenoue
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 388X9C8CWR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
targets:
  WhiteBoxCartoonization-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ldenoue.WhiteBoxCartoonization
        PRODUCT_NAME: WhiteBox Cartoonization
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: White Box
        INFOPLIST_KEY_NSCameraUsageDescription: Cartoonize the live camera entirely on this device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a video to cartoonize entirely on this device.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  WhiteBoxCartoonization-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ldenoue.WhiteBoxCartoonization.mac
        PRODUCT_NAME: White Box Cartoonization
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Cartoonize the live camera entirely on this Mac.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a video to cartoonize entirely on this Mac.
        CODE_SIGN_ENTITLEMENTS: WhiteBoxCartoonization.entitlements
