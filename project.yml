name: WhiteBoxCartoonization
options:
  bundleIdPrefix: com.ldenoue
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 388X9C8CWR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
targets:
  WhiteBoxCartoonization-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Models
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ldenoue.WhiteBoxCartoonization
        PRODUCT_NAME: WhiteBox Cartoonization
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: White Box
        INFOPLIST_KEY_NSCameraUsageDescription: Cartoonize the live camera entirely on this device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a video to cartoonize entirely on this device.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  WhiteBoxCartoonization-iOS:
    build:
      targets:
        WhiteBoxCartoonization-iOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
